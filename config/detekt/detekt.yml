# =============================================================================
# COMPOSE RULES (io.nlopez.compose.rules)
# Specialized rules for Jetpack Compose / Compose Multiplatform
# =============================================================================
Compose:
  active: true
  # Naming Rules
  ComposableNaming:
    active: true
    # Ensure Composables use PascalCase naming convention
  PreviewNaming:
    active: true
    # Require "Preview" suffix for @Preview functions
    previewPublicOnlyIfParams: true

  # Modifier Rules
  ModifierMissing:
    active: true
    # Flag public Composables without a Modifier parameter
    checkModifiersForVisibility: 'only_public'
  ModifierReused:
    active: true
    # Detect when a modifier is passed to multiple children
  ModifierWithoutDefault:
    active: true
    # Ensure Modifier parameter has a default value
  ModifierNotUsedAtRoot:
    active: true
    # Check that modifier is applied to the root composable
  ModifierComposable:
    active: true
    # Check for Composable modifiers being created

  # Stability Rules
  UnstableCollections:
    active: true
    # Flag unstable collection parameters in Composables (List, Set, Map)

  # State Rules
  RememberMissing:
    active: true
    # Flag when remember is potentially missing
  RememberContentMissing:
    active: true
    # Check for missing rememberSaveable
  MutableParams:
    active: true
    # Avoid mutable parameters in Composables

  # Content Emitter Rules
  ContentEmitterReturningValues:
    active: true
    # Check content emitter patterns
  MultipleContentEmitters:
    active: true
    # Avoid multiple content emitters in the same composable
    # Helps catch issues with multiple lazy columns/rows

  # Parameter Ordering
  ComposableParamOrder:
    active: true
    # Ensure proper parameter ordering: required, optional with defaults, modifier, trailing lambdas

  # Lambda Rules
  LambdaParameterInRestartableEffect:
    active: true
    # Check for lambda parameters in restartable effects
  CompositionLocalAllowlist:
    active: false
    # Allowlist specific CompositionLocals

  # View Model Rules
  ViewModelForwarding:
    active: true
    # Flag when ViewModel is passed to child composables
  ViewModelInjection:
    active: true
    # Check ViewModel injection patterns

  # Material Design Rules
  Material2:
    active: false
    # Disable Material2 specific checks (using Material3)

  # Default Immutable Check
  DefaultsVisibility:
    active: false
    # Check visibility of defaults objects

# Formatting rules, wrapped from ktlint by detekt-rules-ktlint-wrapper.
# This is the only rule set that supports auto correction: the default detekt rule sets never
# rewrite code. CI formats with `./gradlew detektAll -Pdetekt.autocorrect=true`.
# Rules that overlap an already active detekt rule are disabled here, so a single problem is not
# reported twice (once by detekt, once by ktlint) on SonarCloud.
ktlint:
  active: true
  # Matches kotlin.code.style=official in gradle.properties. 'ktlint_official' would be far more
  # invasive on a code base that has never been formatted by this rule set.
  code_style: 'intellij_idea'
  indentStyle: 'space'
  autoCorrect: true
  AnnotationOnSeparateLine:
    active: true
    autoCorrect: true
    indentSize: 4
  AnnotationSpacing:
    active: true
    autoCorrect: true
  ArgumentListWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
    ignoreRuleParameterThreshold: 8
  BackingPropertyNaming:
    active: false  # naming/VariableNaming already covers backing properties
  BinaryExpressionWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
  BlankLineBeforeDeclaration:
    active: false
  BlankLineBetweenWhenConditions:
    active: true
    autoCorrect: true
    lineBreakAfterWhenEntries: true
  BlockCommentInitialStarAlignment:
    active: true
    autoCorrect: true
  ChainMethodContinuation:
    active: false
  ChainWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
  ClassName:
    active: false  # naming/ClassNaming
  ClassSignature:
    active: true
    autoCorrect: true
    indentSize: 4
  CommentSpacing:
    active: true
    autoCorrect: true
  CommentWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
  ConditionWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
  ContextReceiverListWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
  ContextReceiverMapping:
    active: true
    autoCorrect: true
    indentSize: 4
  EnumEntryNameCase:
    active: false  # naming/EnumNaming, with pattern '[A-Z][_a-zA-Z0-9]*'
  EnumWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
  ExpressionOperandWrapping:
    active: false
  Filename:
    active: false  # naming/MatchingDeclarationName
  FinalNewline:
    active: true
