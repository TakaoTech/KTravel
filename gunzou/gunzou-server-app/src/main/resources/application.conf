ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [
     com.takaotech.ktravel.gunzou.server.JvmModuleKt.jvmModule
    ]
  }
}

# What this deployment requires of its callers. Every value comes from the environment: the same
# image runs everywhere and carries no secret of its own.
#
# Authentication is switched off: this server answers any caller, and the startup log says so. The
# rate limit is on unless it is switched off on purpose, and the routing provider key is still read
# from the caller's X-Gunzo-Provider-Key header or from NAVIGATOR_PROVIDER_API_KEY.
navigator {
  # AUTH DISABLED: who may call this server, comma separated. Callers presented one as
  # `Authorization: Bearer <token>`. Uncomment together with every `AUTH DISABLED` marker in the
  # Kotlin sources to bring the bearer provider back.
  # accessTokens = ${?NAVIGATOR_ACCESS_TOKENS}

  # The routing provider key this server uses when a caller sends none. Setting it is what stops the
  # app having to put a provider key on every device and send it across the network on every request.
  providerApiKey = ${?NAVIGATOR_PROVIDER_API_KEY}

  # Reported by GET /v1/health, so a bug report names the build it came from.
  version = ${?NAVIGATOR_VERSION}

  rateLimit {
    enabled = ${?NAVIGATOR_RATE_LIMIT_ENABLED}
    requests = ${?NAVIGATOR_RATE_LIMIT_REQUESTS}
    refillSeconds = ${?NAVIGATOR_RATE_LIMIT_REFILL_SECONDS}
  }
}
