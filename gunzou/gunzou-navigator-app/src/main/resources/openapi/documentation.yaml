openapi: "3.0.3"
info:
  title: "gunzo-navigator"
  description: |
    One HTTP contract in front of several routing engines.

    The requests are asymmetric on purpose: there is a path per provider API, each with its own
    fully typed body, because the inputs of a road router and of a timetable have nothing in
    common and flattening them would mean a denominator that fits neither. The *answers* are one
    shape, `RouteResponse`, and that is where the value is — a client draws a route without knowing
    which engine produced it.

    The rule for new paths is one path per distinct provider API, never one per mode of transport:
    a car and a bicycle route are the same API with a different field, so they share `/v1/here/car`.
  version: "1.0.0"

servers:
  - url: "http://127.0.0.1:8080"
    description: "Embedded in the application, on a port the operating system assigns"
  - url: "https://navigator.example.com"
    description: "Remote deployment"

security:
  - accessToken: []

tags:
  - name: routing
    description: "Computing routes. Authenticated and rate limited."
  - name: discovery
    description: "What this server can do, and whether it is alive."

paths:
  /v1/here/car:
    post:
      tags: [routing]
      summary: "Route on roads, whatever the vehicle"
      description: |
        `car` names the profile, not the vehicle: pedestrian, bicycle and truck routes all come from
        the same upstream API with a different `transportMode`.
      parameters:
        - $ref: "#/components/parameters/ProviderKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HereCarRouteRequest"
      responses:
        "200":
          $ref: "#/components/responses/Routes"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /v1/here/transit:
    post:
      tags: [routing]
      summary: "Route on public transport"
      description: |
        A separate path from the road profile because it is a separate upstream API, with parameters
        that have no meaning on the other one — there is no `changes` on a car route and no
        `routingMode` on a timetable.
      parameters:
        - $ref: "#/components/parameters/ProviderKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HereTransitRouteRequest"
      responses:
        "200":
          $ref: "#/components/responses/Routes"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /v1/profiles:
    get:
      tags: [discovery]
      security: []
      summary: "What this server can route with"
      description: |
        What lets a client draw a provider selector from the server instead of from a `when` it would
        have to ship an update to change. A profile is listed because an endpoint exists for it.
      responses:
        "200":
          description: "The mounted profiles"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCatalogResponse"

  /v1/health:
    get:
      tags: [discovery]
      security: []
      summary: "Whether the server is answering"
      description: |
        Liveness only: it says nothing about the providers behind it. Checking those would turn a
        health probe into a call to a paid third party on every poll. Deliberately outside both the
        authentication and the rate limit, so a probe never reports an outage the server does not
        have.
      responses:
        "200":
          description: "Serving"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      description: |
        Who may call this server. Configured through `NAVIGATOR_ACCESS_TOKENS`; a deployment with
        none configured accepts anyone, which is only ever right for a server on a loopback socket
        inside the application that started it.

  parameters:
    ProviderKey:
      name: X-Gunzo-Provider-Key
      in: header
      required: false
      schema: { type: string }
      description: |
        The caller's own key for the routing provider behind the requested profile.

        Embedded, the server runs inside the application that owns the key and this is how it gets
        there. A remote deployment can instead hold a key of its own
        (`NAVIGATOR_PROVIDER_API_KEY`), which is what stops a provider key having to live on every
        device and cross the network on every request; a key sent here still wins when both exist.

  responses:
    Routes:
      description: "The alternatives, best first"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RouteResponse"
    Error:
      description: "The failure, in the contract's terms"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }

    RouteTime:
      description: |
        When the traveller wants to be moving. An absolute instant rather than a local date and
        time: the provider needs an unambiguous point, and the origin's own offset is something the
        server knows and the caller does not necessarily.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [now] }
        - type: object
          required: [type, instant]
          properties:
            type: { type: string, enum: [departAt, arriveBy] }
            instant: { type: string, format: date-time }

    Units:
      type: string
      enum: [METRIC, IMPERIAL]
      description: |
        Units for the text the provider localizes. The numbers in the response are always metric —
        meters and seconds — whatever is asked for here.

    TravelMode:
      type: string
      enum: [CAR, TRUCK, TAXI, BUS, PEDESTRIAN, BICYCLE, SCOOTER, TRANSIT, OTHER]

    TransitMode:
      type: string
      enum:
        [HIGH_SPEED_TRAIN, INTERCITY_TRAIN, INTER_REGIONAL_TRAIN, REGIONAL_TRAIN, CITY_TRAIN, BUS,
         PRIVATE_BUS, BUS_RAPID, FERRY, SUBWAY, LIGHT_RAIL, MONORAIL, INCLINED, AERIAL, FLIGHT, OTHER]

    SupportedModes:
      description: |
        The modes a profile accepts, spelled in the vocabulary of the API that answers it. The two
        HERE endpoints do not share one: their `bus` and `pedestrian` collide by name and not by
        meaning, so the list is discriminated by `type` and a client that does not know the variant
        knows it cannot read the names either.
      oneOf:
        - $ref: "#/components/schemas/SupportedModesNone"
        - $ref: "#/components/schemas/SupportedModesHereRoad"
        - $ref: "#/components/schemas/SupportedModesTransit"
      discriminator:
        propertyName: type
        mapping:
          none: "#/components/schemas/SupportedModesNone"
          hereRoad: "#/components/schemas/SupportedModesHereRoad"
          transit: "#/components/schemas/SupportedModesTransit"

    SupportedModesNone:
      type: object
      description: A profile that takes no mode at all.
      required: [type]
      properties:
        type: { type: string, enum: [none] }

    SupportedModesHereRoad:
      type: object
      description: HERE Routing v8, whose `transportMode` is required and single valued.
      required: [type, modes]
      properties:
        type: { type: string, enum: [hereRoad] }
        modes:
          type: array
          items:
            type: string
            enum: [CAR, TRUCK, PEDESTRIAN, BICYCLE, SCOOTER, TAXI, BUS, PRIVATE_BUS]

    SupportedModesTransit:
      type: object
      description: |
        The public transport vocabulary, which HERE Public Transit v8 takes as a filter over the
        vehicles an answer may use; an empty filter admits all of them.
      required: [type, modes]
      properties:
        type: { type: string, enum: [transit] }
        modes:
          type: array
          items: { $ref: "#/components/schemas/TransitMode" }

    HereCarRouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: "#/components/schemas/GeoPoint" }
        destination: { $ref: "#/components/schemas/GeoPoint" }
        via:
          type: array
          items: { $ref: "#/components/schemas/GeoPoint" }
        transportMode:
          type: string
          enum: [CAR, TRUCK, PEDESTRIAN, BICYCLE, SCOOTER, TAXI, BUS, PRIVATE_BUS]
          default: CAR
        routingMode: { type: string, enum: [FAST, SHORT], default: FAST }
        alternatives: { type: integer, minimum: 1, maximum: 6, default: 1 }
        time: { $ref: "#/components/schemas/RouteTime" }
        units: { $ref: "#/components/schemas/Units" }
        language: { type: string, description: "IETF BCP 47 tag, such as it-IT" }
        avoid:
          type: object
          properties:
            features:
              type: array
              items:
                type: string
                enum: [TOLL_ROAD, CONTROLLED_ACCESS_HIGHWAY, FERRY, CAR_SHUTTLE_TRAIN, TUNNEL,
                       DIRT_ROAD, DIFFICULT_TURNS, U_TURNS, SEASONAL_CLOSURE]
        returnAttributes:
          type: array
          description: |
            Extra data to compute. Each costs something upstream. ACTIONS requires POLYLINE and
            INSTRUCTIONS requires ACTIONS; a request that breaks either is rejected before the
            provider is called.
          items:
            type: string
            enum: [POLYLINE, ACTIONS, INSTRUCTIONS, SUMMARY, TRAVEL_SUMMARY, TURN_BY_TURN_ACTIONS,
                   TYPICAL_DURATION, ELEVATION, TOLLS, INCIDENTS, ROUTE_LABELS]

    HereTransitRouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: "#/components/schemas/GeoPoint" }
        destination: { $ref: "#/components/schemas/GeoPoint" }
        alternatives: { type: integer, minimum: 1, maximum: 5, default: 1 }
        time: { $ref: "#/components/schemas/RouteTime" }
        modes:
          type: object
          description: "An allow list narrowed by a deny list. Empty means every kind."
          properties:
            include:
              type: array
              items: { $ref: "#/components/schemas/TransitMode" }
            exclude:
              type: array
              items: { $ref: "#/components/schemas/TransitMode" }
        changes: { type: integer, minimum: 0, description: "Most transfers the traveller accepts" }
        pedestrianSpeedMetersPerSecond: { type: number, format: double, minimum: 0.5, maximum: 2 }
        pedestrianMaxDistanceMeters: { type: integer, minimum: 0 }
        language: { type: string }
        units: { $ref: "#/components/schemas/Units" }

    RouteResponse:
      type: object
      required: [provider, profile]
      description: "The answer of every routing endpoint, whichever provider computed it."
      properties:
        provider: { type: string, example: "here" }
        profile: { type: string, example: "car" }
        routes:
          type: array
          description: |
            The alternatives, best first. Never empty: a provider that finds nothing produces
            NO_ROUTE_FOUND instead, so there is one place where routes can be absent.
          items: { $ref: "#/components/schemas/Route" }
        notices:
          type: array
          items: { $ref: "#/components/schemas/Notice" }

    Route:
      type: object
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/RouteSummary" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/RouteSection" }

    RouteSummary:
      type: object
      required: [durationSeconds, distanceMeters]
      properties:
        durationSeconds: { type: integer, format: int64 }
        distanceMeters: { type: integer }
        baseDurationSeconds:
          type: integer
          format: int64
          description: "Travel time with no traffic. The difference is the delay being warned about."

    RouteSection:
      type: object
      required: [summary, mode]
      description: |
        One leg, travelled in a single mode. `transit` is what lets a road profile and a public
        transport one share this type: null on every leg travelled under the traveller's own power
        or in their own vehicle, populated on the ones served by a scheduled vehicle.
      properties:
        summary: { $ref: "#/components/schemas/RouteSummary" }
        mode: { $ref: "#/components/schemas/TravelMode" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RouteAction" }
        departure: { $ref: "#/components/schemas/RouteWaypoint" }
        arrival: { $ref: "#/components/schemas/RouteWaypoint" }
        geometry: { $ref: "#/components/schemas/RouteGeometry" }
        transit: { $ref: "#/components/schemas/TransitDetails" }
        tollSystems:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              name: { type: string }
        tolls:
          type: array
          items: { $ref: "#/components/schemas/TollCost" }

    RouteAction:
      type: object
      required: [action, durationSeconds]
      properties:
        action: { type: string, example: "turn" }
        durationSeconds: { type: integer, format: int64 }
        distanceMeters: { type: integer }
        instruction: { type: string }
        offset: { type: integer, description: "Index into the section geometry" }
        direction: { type: string }
        severity: { type: string }

    RouteWaypoint:
      type: object
      required: [place]
      properties:
        place: { $ref: "#/components/schemas/GeoPoint" }
        time: { $ref: "#/components/schemas/ZonedTime" }
        name: { type: string }

    ZonedTime:
      type: object
      required: [instant, offsetSeconds]
      description: |
        Both halves are needed. The instant is what durations are computed on; the offset is what
        turns it back into the wall clock a traveller reads on the departure board, which is local
        to that stop and not to the device.
      properties:
        instant: { type: string, format: date-time }
        offsetSeconds: { type: integer }

    RouteGeometry:
      type: object
      required: [encoding, value]
      description: |
        Declared rather than normalized. Re-encoding every provider's polyline to one format would
        cost a decode and an encode per section and, going to a coarser precision, would round
        coordinates the router bothered to compute.
      properties:
        encoding: { type: string, enum: [HERE_FLEXIBLE, POLYLINE5, POLYLINE6] }
        value: { type: string }

    TransitDetails:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/TransitMode" }
        name: { type: string, example: "R 2841" }
        category: { type: string, example: "Regionale" }
        headsign:
          type: string
          description: "The destination on the front of the vehicle: how the two directions differ"
        agency:
          type: object
          required: [name]
          properties:
            name: { type: string }
            id: { type: string }
            website: { type: string }
        color: { type: string, example: "#008C45" }
        textColor: { type: string }
        intermediateStops:
          type: array
          items:
            type: object
            required: [place]
            properties:
              place: { $ref: "#/components/schemas/GeoPoint" }
              name: { type: string }
              arrival: { $ref: "#/components/schemas/ZonedTime" }
              departure: { $ref: "#/components/schemas/ZonedTime" }

    TollCost:
      type: object
      properties:
        tollSystemRefs:
          type: array
          items: { type: integer }
          description: "Indices into the section's tollSystems"
        countryCode: { type: string, description: "ISO 3166-1 alpha-3" }
        fares:
          type: array
          items:
            type: object
            required: [price]
            properties:
              price:
                type: object
                required: [currency, minimum, maximum]
                description: "Equal ends for a single figure, so a client formats one shape."
                properties:
                  currency: { type: string }
                  minimum: { type: number, format: double }
                  maximum: { type: number, format: double }
                  estimated: { type: boolean }
              name: { type: string }
              paymentMethods:
                type: array
                items: { type: string }
        collectionLocations:
          type: array
          items: { $ref: "#/components/schemas/GeoPoint" }

    Notice:
      type: object
      required: [code]
      properties:
        code: { type: string, example: "violatedAvoidTollRoad" }
        title: { type: string }
        severity: { type: string, enum: [INFO, CRITICAL], default: INFO }

    ProviderCatalogResponse:
      type: object
      properties:
        profiles:
          type: array
          items: { $ref: "#/components/schemas/ProviderProfileDescriptor" }

    ProviderProfileDescriptor:
      type: object
      required: [provider, profile, path, displayName, maxAlternatives]
      properties:
        provider: { type: string, example: "here" }
        profile: { type: string, example: "car" }
        path: { type: string, example: "/v1/here/car" }
        displayName: { type: string, example: "HERE road routing" }
        supportedModes: { $ref: "#/components/schemas/SupportedModes" }
        maxAlternatives: { type: integer }
        maxVia: { type: integer, description: "Zero means the profile takes no intermediate stops" }
        supportsArriveBy: { type: boolean }
        supportsTolls: { type: boolean }
        requiresApiKey: { type: boolean }

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string, example: "1.0.0-SNAPSHOT" }

    ErrorResponse:
      type: object
      required: [code, message]
      description: |
        The body of every failing response, whatever the status. A client decides what to do from
        `code` alone; the free text is for whoever is reading the logs.
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, UNAUTHENTICATED, MISSING_CREDENTIALS, PROVIDER_UNAUTHORIZED,
                 PROVIDER_RATE_LIMITED, PROVIDER_UNAVAILABLE, UNSUPPORTED_OPTION, NO_ROUTE_FOUND,
                 INTERNAL]
        message: { type: string, description: "Never localized: it is not shown to a traveller" }
        providerStatus:
          type: integer
          description: "The status the upstream provider answered with, when one did"
        providerMessage:
          type: string
          description: "The upstream's own words, kept verbatim"
