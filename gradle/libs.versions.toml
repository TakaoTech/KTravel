mockk-android-agent = { module = "io.mockk:mockk-agent", version.ref = "mockk" }

maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibreCompose" }
# Desktop native runtimes: one artifact per OS/architecture pair, picked from the build host.
maplibre-runtime-linux-x64 = { module = "org.maplibre.compose:maplibre-compose-runtime-vulkan-linux-x64", version.ref = "maplibreCompose" }
maplibre-runtime-linux-arm64 = { module = "org.maplibre.compose:maplibre-compose-runtime-vulkan-linux-arm64", version.ref = "maplibreCompose" }
maplibre-runtime-windows-x64 = { module = "org.maplibre.compose:maplibre-compose-runtime-vulkan-windows-x64", version.ref = "maplibreCompose" }
maplibre-runtime-windows-arm64 = { module = "org.maplibre.compose:maplibre-compose-runtime-vulkan-windows-arm64", version.ref = "maplibreCompose" }
maplibre-runtime-macos-arm64 = { module = "org.maplibre.compose:maplibre-compose-runtime-metal-macos-arm64", version.ref = "maplibreCompose" }

kotlinx-measure = "io.nacular.measured:measured:0.5.0"
kotlinx-money = "com.eriksencosta:money:0.2.0"

compose-coil = "io.coil-kt.coil3:coil-compose:3.6.0"
