filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }

platformtools-core = { module = "io.github.kdroidfilter:platformtools.core", version.ref = "platformtoolsCore" }

dnd = { module = "com.mohamedrejeb.dnd:compose-dnd", version = "0.5.0" }

couchbase-lite = { module = "dev.kotbase:couchbase-lite", version.ref = "kotbase" }

# kzip non pubblica un artefatto per il target androidJvm: su Android/JVM si usa la variante jvm,
# consentita dalla regola di compatibilità KGP jvm -> androidJvm (vedi sourceSet jvmZipMain).
kzip = { module = "de.jonasbroeckmann.kzip:kzip", version.ref = "kzip" }
kzip-jvm = { module = "de.jonasbroeckmann.kzip:kzip-jvm", version.ref = "kzip" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }

circuit-foundation = { module = "com.slack.circuit:circuit-foundation", version.ref = "circuit" }
circuit-runtime = { module = "com.slack.circuit:circuit-runtime", version.ref = "circuit" }
circuit-runtime-presenter = { module = "com.slack.circuit:circuit-runtime-presenter", version.ref = "circuit" }
circuit-runtime-ui = { module = "com.slack.circuit:circuit-runtime-ui", version.ref = "circuit" }
circuit-test = { module = "com.slack.circuit:circuit-test", version.ref = "circuit" }

hyphen = { module = "io.github.densermeerkat:hyphen", version.ref = "hyphen" }
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdown-renderer" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }

compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
#compottie-lite = { module = "io.github.alexzhirkevich:compottie-lite", version.ref = "compottie" }
#compottie-dot = { module = "io.github.alexzhirkevich:compottie-dot", version.ref = "compottie" }
#compottie-network = { module = "io.github.alexzhirkevich:compottie-network", version.ref = "compottie" }
compottie-resources = { module = "io.github.alexzhirkevich:compottie-resources", version.ref = "compottie" }

# Signum: scrypt for key derivation and AES-256-GCM for the archive secrets. `indispensable` carries
# the algorithm types, `supreme` the implementations that bind to the platform crypto providers.
signum-indispensable = { module = "at.asitplus.signum:indispensable", version.ref = "signum-indispensable" }
signum-supreme = { module = "at.asitplus.signum:supreme", version.ref = "signum-supreme" }

detekt-formatting = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-composerules = { module = "io.nlopez.compose.rules:detekt", version = "0.6.3" }

aboutLibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutLibraries" }
aboutLibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutLibraries" }


# region Server deps
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
logback-classic-server = { module = "ch.qos.logback:logback-classic", version = "1.5.35" }

kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kermit-koin = { module = "co.touchlab:kermit-koin", version.ref = "kermit" }
# Version aligned with the one Ktor 3.5.0 already resolves.
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.18" }
# endregion Server deps

